<!-- templates/cancel.html -->
{% extends "base.html" %}

{% block title %}Commande annulée{% endblock %}

{% block body %}
<div class="message-card cancel">
  <div style="font-size: 4rem;">❌</div>
  <h2>Paiement annulé</h2>
  <p>Aucun problème ! Votre commande n'a pas été finalisée.</p>
  <p style="margin: 20px 0; color: var(--text-light);">
    N'hésitez pas à réessayer quand vous serez prêt.
  </p>
  <a href="{{ url_for('index') }}">← Voir les plats</a>
</div>
{% endblock %}
